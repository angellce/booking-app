spring.application.name=booking
server.port=${PORT:8080}

# Database (defaults match docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/booking}
spring.datasource.username=${DB_USERNAME:booking}
spring.datasource.password=${DB_PASSWORD:booking}

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Local secrets (e.g. GEMINI_API_KEY) can be kept in backend/.env, which is git-ignored; real env vars still win
spring.config.import=optional:file:.env[.properties]

# Gemini (Google AI Studio free tier) for booking confirmation messages; disabled when no key is set
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=5s

# Google Calendar clash check (FreeBusy API, service account); disabled when either value is empty
app.google-calendar.calendar-id=${GOOGLE_CALENDAR_ID:}
app.google-calendar.service-account-file=${GOOGLE_SERVICE_ACCOUNT_FILE:}
